<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BV Workplace — 數位辦公室與費用報銷系統 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   ORBIS WORKPLACE — DESIGN TOKENS
   Brand colour per spec: sidebar text/icon = #3bbcb3
   ============================================================ */
:root{
  --ink:#12203B;
  --slate-900:#0E1930;
  --slate-700:#3D4C6B;
  --slate-500:#6B7A99;
  --slate-300:#AEB9CE;
  --slate-100:#E7EAF2;
  --bg:#F2F4F8;
  --panel:#FFFFFF;
  --line:#DDE2EC;
  --brand:#3BBCB3;
  --brand-ink:#1E7A73;
  --brand-soft:#E2F7F5;
  --accent:#3BBCB3;
  --accent-ink:#1E7A73;
  --accent-soft:#E2F7F5;
  --brass:#9C6B2E;
  --brass-soft:#F6EAD6;
  --good:#1E8E5A;
  --good-soft:#E6F5EC;
  --warn:#9A6B00;
  --warn-soft:#FBF0D6;
  --bad:#B3392C;
  --bad-soft:#FBE7E4;
  --info:#2E5FA6;
  --info-soft:#E6EEF9;
  --hv:#6A4C93;
  --hv-soft:#EFE6F5;
  --radius:10px;
  --font-body:Arial, Helvetica, sans-serif;
  --font-display:Arial, Helvetica, sans-serif;
  --font-mono:'IBM Plex Mono','Cascadia Code','SFMono-Regular',Consolas,monospace;
  --shadow-sm:0 1px 2px rgba(14,25,48,.06), 0 1px 1px rgba(14,25,48,.04);
  --shadow-md:0 6px 20px rgba(14,25,48,.10);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--slate-900);margin:0 0 .4em;letter-spacing:.01em;}
h1{font-size:1.7rem;font-weight:700;}
h2{font-size:1.2rem;font-weight:700;}
h3{font-size:1rem;font-weight:700;}
p{margin:0 0 .8em;color:var(--slate-700);}
a{color:var(--accent-ink);}
.mono{font-family:var(--font-mono);}
button{font-family:var(--font-body);cursor:pointer;}
table{border-collapse:collapse;width:100%;}
th{text-align:left;font-family:var(--font-display);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--slate-500);padding:8px 10px;border-bottom:1px solid var(--line);}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:.88rem;}
tr:last-child td{border-bottom:none;}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px;}
::selection{background:var(--accent-soft);}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ---------- Shell ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:232px;flex:0 0 232px;background:#fff;color:var(--slate-700);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  border-right:1px solid var(--line);box-shadow:2px 0 14px rgba(20,30,50,.04);
}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;border-bottom:1px solid var(--line);}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-ink));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:#fff;font-size:.95rem;flex:0 0 34px;}
.brand-text .name{font-family:var(--font-display);font-weight:700;font-size:1rem;color:var(--brand-ink);line-height:1.15;}
.brand-text .tag{font-size:.68rem;color:var(--slate-500);letter-spacing:.03em;}
nav.mainnav{padding:12px 10px;flex:1;overflow-y:auto;}
nav.mainnav .navlabel{font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;color:var(--slate-300);padding:14px 10px 6px;}
nav.mainnav button.navitem{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--brand-ink);
  padding:9px 10px;border-radius:8px;font-size:.87rem;font-weight:600;margin-bottom:2px;transition:background .12s,color .12s;
}
nav.mainnav button.navitem .ic{width:18px;text-align:center;flex:0 0 18px;font-size:.95rem;color:var(--brand);}
nav.mainnav button.navitem:hover{background:var(--brand-soft);}
nav.mainnav button.navitem.active{background:var(--brand);color:#fff;}
nav.mainnav button.navitem.active .ic{color:#fff;}
.sidebar-foot{padding:12px 16px 16px;border-top:1px solid var(--line);font-size:.68rem;color:var(--slate-500);}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:10px 22px;
}
.demo-banner{
  background:repeating-linear-gradient(135deg,var(--brass-soft),var(--brass-soft) 10px,#fff 10px,#fff 20px);
  border-bottom:1px solid var(--line);color:var(--brass);font-weight:700;font-size:.74rem;
  padding:6px 22px;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
}
.lang-toggle{display:flex;gap:4px;}
.lang-toggle button{border:1px solid var(--brass);background:#fff;color:var(--brass);border-radius:6px;padding:3px 10px;font-size:.7rem;font-weight:700;}
.lang-toggle button.active{background:var(--brass);color:#fff;}
.hamburger{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:1rem;}
.topbar .title-block{flex:1;min-width:0;}
.topbar .title-block .sub{font-size:.76rem;color:var(--slate-500);}
.identity-switch{position:relative;}
.identity-btn{
  display:flex;align-items:center;gap:9px;background:var(--slate-100);border:1px solid var(--line);
  border-radius:10px;padding:6px 12px 6px 8px;
}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:.78rem;flex:0 0 28px;}
.identity-btn .id-text{text-align:left;line-height:1.2;}
.identity-btn .id-text .nm{font-weight:700;font-size:.82rem;color:var(--ink);}
.identity-btn .id-text .rl{font-size:.68rem;color:var(--slate-500);}
.dropdown{
  position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow-md);width:290px;padding:6px;z-index:40;
}
.dropdown .dd-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--slate-500);padding:8px 10px 4px;}
.dropdown button.dd-item{
  display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:none;border-radius:8px;
  padding:8px 10px;
}
.dropdown button.dd-item:hover{background:var(--slate-100);}
.dropdown button.dd-item.current{background:var(--brand-soft);}
.dropdown .dd-item .nm{font-weight:700;font-size:.83rem;}
.dropdown .dd-item .rl{font-size:.71rem;color:var(--slate-500);}
.bell-btn{position:relative;background:none;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:1rem;color:var(--slate-700);}
.bell-dot{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;border-radius:20px;font-size:.62rem;font-weight:700;padding:1px 5px;font-family:var(--font-mono);}
.notif-dropdown{width:340px;max-height:400px;overflow-y:auto;}
.notif-item{display:block;padding:9px 10px;border-radius:8px;font-size:.8rem;}
.notif-item:hover{background:var(--slate-100);}
.notif-item .msg{color:var(--ink);}
.notif-item .meta{color:var(--slate-500);font-size:.68rem;margin-top:2px;}
.notif-empty{padding:18px 10px;color:var(--slate-500);font-size:.82rem;text-align:center;}

.content{flex:1;padding:22px 26px 60px;max-width:1180px;width:100%;margin:0 auto;}

/* ---------- Cards / generic ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.card-pad{padding:18px 20px;}
.grid{display:grid;gap:16px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:960px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-3{grid-template-columns:repeat(2,1fr);}.grid.cols-2{grid-template-columns:1fr;}}
@media (max-width:640px){.grid.cols-4,.grid.cols-3{grid-template-columns:1fr;}}

.metric{padding:16px 18px;}
.metric .k{font-family:var(--font-mono);font-size:1.7rem;font-weight:600;color:var(--ink);}
.metric .l{font-size:.74rem;color:var(--slate-500);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}

.btn{
  display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid var(--line);background:#fff;
  color:var(--ink);font-size:.83rem;font-weight:700;padding:8px 14px;transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--slate-100);}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn.primary:hover{background:var(--brand-ink);}
.btn.danger{background:#fff;border-color:var(--bad);color:var(--bad);}
.btn.danger:hover{background:var(--bad-soft);}
.btn.ghost{background:none;border-color:transparent;}
.btn.ghost:hover{background:var(--slate-100);}
.btn.sm{padding:5px 10px;font-size:.76rem;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:20px;}
.badge.good{background:var(--good-soft);color:var(--good);}
.badge.warn{background:var(--warn-soft);color:var(--warn);}
.badge.bad{background:var(--bad-soft);color:var(--bad);}
.badge.info{background:var(--info-soft);color:var(--info);}
.badge.hv{background:var(--hv-soft);color:var(--hv);}
.badge.neutral{background:var(--slate-100);color:var(--slate-700);}

.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}
.tabbar button{background:none;border:none;padding:9px 14px;font-size:.83rem;font-weight:700;color:var(--slate-500);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tabbar button.active{color:var(--brand-ink);border-bottom-color:var(--brand);}
.tabbar button:hover{color:var(--ink);}

.field{margin-bottom:14px;}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--slate-700);margin-bottom:4px;}
.field .hint{font-size:.7rem;color:var(--slate-500);margin-top:3px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem;font-family:var(--font-body);background:#fff;color:var(--ink);
}
.field textarea{resize:vertical;min-height:64px;}
.field input[readonly]{background:var(--slate-100);color:var(--slate-700);}
.field input.invalid,.field select.invalid{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad);}
.err-text{color:var(--bad);font-size:.72rem;margin-top:4px;}
.req-mark{color:var(--bad);margin-left:2px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:640px){.row2{grid-template-columns:1fr;}}
.amt-row{display:grid;grid-template-columns:2fr 1fr;gap:10px;}

.table-wrap{overflow-x:auto;}
.reqid{font-family:var(--font-mono);font-weight:700;color:var(--ink);}
.amount-cell{font-family:var(--font-mono);font-weight:700;}

/* ---------- Route Stepper (signature element) ---------- */
.stepper{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:10px 0 4px;}
.step{display:flex;align-items:center;}
.step .node{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:76px;text-align:center;}
.step .dot{width:26px;height:26px;border-radius:50%;background:var(--slate-100);border:2px solid var(--slate-300);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:var(--slate-500);font-family:var(--font-mono);}
.step .lbl{font-size:.63rem;font-weight:700;color:var(--slate-500);text-transform:uppercase;letter-spacing:.02em;}
.step.done .dot{background:var(--brand);border-color:var(--brand);color:#fff;}
.step.done .lbl{color:var(--brand-ink);}
.step.current .dot{background:#fff;border-color:var(--brand);color:var(--brand-ink);box-shadow:0 0 0 4px var(--brand-soft);animation:pulse 1.8s ease-in-out infinite;}
.step.current .lbl{color:var(--brand-ink);font-weight:700;}
.step.skipped .dot{background:var(--slate-100);border-style:dashed;color:var(--slate-300);}
.step.skipped .lbl{color:var(--slate-300);text-decoration:line-through;}
.connector{width:26px;height:2px;background:var(--slate-300);margin:0 2px 22px;}
.connector.filled{background:var(--brand);}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--brand-soft);}50%{box-shadow:0 0 0 7px var(--brand-soft);}}

/* ---------- Misc components ---------- */
.notice{border-radius:8px;padding:10px 12px;font-size:.82rem;display:flex;gap:8px;align-items:flex-start;}
.notice.info{background:var(--info-soft);color:var(--info);}
.notice.warn{background:var(--warn-soft);color:var(--warn);}
.notice.bad{background:var(--bad-soft);color:var(--bad);}
.notice.good{background:var(--good-soft);color:var(--good);}
.lockstrip{background:var(--slate-900);color:#fff;padding:9px 14px;border-radius:8px;font-size:.8rem;display:flex;align-items:center;gap:8px;font-weight:700;}

.qa-card{padding:16px;display:flex;flex-direction:column;gap:8px;min-height:118px;}
.qa-card .qa-ic{font-size:1.3rem;}
.qa-card h3{margin:0;font-size:.92rem;}
.qa-card p{font-size:.76rem;margin:0;flex:1;}
.qa-card.placeholder{opacity:.72;}

.hist-item{border-left:2px solid var(--line);padding:2px 0 14px 16px;position:relative;}
.hist-item::before{content:'';position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--brand);}
.hist-item .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.hist-item .actor{font-weight:700;font-size:.84rem;}
.hist-item .action{font-size:.84rem;}
.hist-item .ts{font-family:var(--font-mono);font-size:.68rem;color:var(--slate-500);}
.hist-item .comment{font-size:.8rem;color:var(--slate-700);background:var(--slate-100);border-radius:7px;padding:7px 9px;margin-top:5px;}
.hist-item .states{font-size:.68rem;color:var(--slate-500);margin-top:3px;font-family:var(--font-mono);}

.modal-backdrop{position:fixed;inset:0;background:rgba(14,25,48,.5);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto;}
.modal{background:#fff;border-radius:12px;max-width:640px;width:100%;box-shadow:var(--shadow-md);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--slate-900);color:#fff;padding:11px 16px;border-radius:9px;font-size:.83rem;box-shadow:var(--shadow-md);max-width:340px;animation:slidein .2s ease-out;}
.toast.good{background:var(--good);}
.toast.bad{background:var(--bad);}
@keyframes slidein{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}

.arch-diagram{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0;}
@media (max-width:900px){.arch-diagram{grid-template-columns:1fr;}}
.arch-box{border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--panel);}
.arch-box .lyr{font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;color:var(--brand-ink);font-weight:700;margin-bottom:4px;}
.arch-box h4{margin:0 0 6px;font-size:.85rem;}
.arch-box p{font-size:.72rem;margin:0;color:var(--slate-500);}

.dl{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:.85rem;}
.dl dt{color:var(--slate-500);font-weight:700;}
.dl dd{margin:0;color:var(--ink);}

.gap-sm{margin-top:8px;}
.gap-md{margin-top:18px;}
.gap-lg{margin-top:30px;}
.muted{color:var(--slate-500);}
.small{font-size:.78rem;}
.center{text-align:center;}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.storage-note{font-size:.66rem;color:var(--warn);margin-top:6px;}

@media (max-width:900px){
  .sidebar{position:fixed;left:-240px;z-index:60;transition:left .18s;box-shadow:var(--shadow-md);}
  .sidebar.open{left:0;}
  .hamburger{display:inline-flex;}
  .content{padding:16px;}
}
@media (max-width:640px){
  .topbar{padding:9px 14px;}
  .demo-banner{padding:6px 14px;font-size:.68rem;}
  .identity-btn .id-text{display:none;}
}
</style>
</head>

/* ---------------- Utility ---------------- */
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,8).toUpperCase(); }
function nowISO(){ return new Date().toISOString(); }
function fmtTS(iso){
  const d = new Date(iso);
  return d.toLocaleString(state.lang==='zh' ? 'zh-TW' : 'en-US', {year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function fmtAmount(amount, currency){ return currency + ' ' + Number(amount).toLocaleString('en-US'); }
function currentUser(){ return userById(state.currentUserId); }
function esc(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nextRequestId(){ state.reqCounter += 1; return 'EXP-2026-0' + state.reqCounter; }
function toast(msg, kind){
  const id = 't'+(state.toastId++);
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' '+kind : '');
  el.id = id; el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3400);
}
function logSystemEvent(actor, type, message){
  state.systemEvents.unshift({id:uid('EVT'), ts:nowISO(), actor, type, message});
}
function notify(userId, requestId, message){
  if (!userId) return;
  state.notifications.unshift({id:uid('NTF'), userId, requestId, message, ts:nowISO(), read:false});
}
function unreadCountFor(userId){ return state.notifications.filter(n=>n.userId===userId && !n.read).length; }

/* ---------------- LocalStorage persistence (Trade-off 3) ---------------- */
function detectStorage(){
  try{ const k='__bv_probe__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; }
}
function saveState(){
  if (!storageOK) return;
  try{
    const snapshot = {
      requests: state.requests, notifications: state.notifications, systemEvents: state.systemEvents,
      config: state.config, reqCounter: state.reqCounter, currentUserId: state.currentUserId, lang: state.lang,
      users: USERS
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
  }catch(e){ /* quota or blocked mid-session — fail silently, demo continues in-memory */ }
}
function loadState(){
  if (!storageOK) return false;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const snap = JSON.parse(raw);
    if (!snap || !Array.isArray(snap.requests) || !snap.requests.length) return false;
    state.requests = snap.requests;
    state.notifications = snap.notifications || [];
    state.systemEvents = snap.systemEvents || [];
    state.config = snap.config || {...CONFIG_DEFAULT};
    state.reqCounter = snap.reqCounter || 100;
    state.currentUserId = snap.currentUserId || 'u1';
    state.lang = snap.lang || 'en';
    if (Array.isArray(snap.users) && snap.users.length) USERS = snap.users;
    return true;
  }catch(e){ return false; }
}

/* ---------------- Routing engine (Configuration-driven) ---------------- */
function computeRoute(amountTWD, cfg){
  cfg = cfg || state.config;
  if (amountTWD <= cfg.level1Max) return {level:1, stages:['Manager','Finance','Cashier'], highValue:false};
  if (amountTWD <= cfg.level2Max) return {level:2, stages:['Manager','GM','Finance','Cashier'], highValue:false};
  return {level:3, stages:['Manager','GM','Finance','Cashier'], highValue:true};
}

/* ---------------- Request + audit event factories ---------------- */
function mkEvent({requestId, actor, role, action, comment, prior, resulting}){
  return {id:uid('AUD'), requestId, actor, role, action, comment: comment||'', prior, resulting, ts: nowISO()};
}

function buildRequest(opts){
  const amountTWD = toTWD(opts.amount, opts.currency);
  const route = computeRoute(amountTWD, state.config);
  const id = nextRequestId();
  const requesterName = userById(opts.requesterId).name;
  const req = {
    id, caseTag: opts.caseTag || null, requesterId: opts.requesterId, department: opts.department,
    expenseDate: opts.expenseDate, expenseType: opts.expenseType, amount: opts.amount, currency: opts.currency,
    amountTWD: Math.round(amountTWD), fxRate: FX_TO_TWD[opts.currency]||1,
    purpose: opts.purpose, costCenter: opts.costCenter, payee: opts.payee, attachment: opts.attachment,
    routeLevel: route.level, stages: route.stages, highValue: route.highValue,
    currentStage: route.stages[0], status: 'Pending' + route.stages[0],
    returnedFrom: null, locked: false, paymentRef: null, paymentDate: null, exception: null,
    createdAt: nowISO(), history: []
  };
  req.history.push(mkEvent({
    requestId:id, actor:requesterName, role:'Requester', action:'Submit',
    comment:'Request submitted for approval. Route computed automatically by current Workflow Configuration (Level '+route.level+(opts.currency!=='TWD' ? '; converted to ~NT$'+Math.round(amountTWD).toLocaleString()+' at demo FX rate '+(FX_TO_TWD[opts.currency]||1) : '')+').',
    prior:'Draft', resulting:req.status
  }));
  notify(notifyRoleId(req.currentStage), id, 'New expense request '+id+' awaiting your approval ('+fmtAmount(req.amount,req.currency)+').');
  return req;
}

      costCenter:c.costCenter, payee:c.payee, attachment:{filename:c.filename, missing:c.missing}
    });
    list.push(req);

}

/* ---------------- Authorization + transition engine ---------------- */
function priorStagesOf(req){
  const idx = req.stages.indexOf(req.currentStage);
  return idx>0 ? req.stages.slice(0, idx) : [];
}
function canAct(user, req, action){
  if (action === 'submit-draft'){ return user.id===req.requesterId && req.status==='Draft'; }
  if (action === 'edit-request'){ return user.id===req.requesterId && (req.status==='Draft' || req.status==='Returned' || req.status==='Rejected'); }
  if (req.locked) return false;
  if (req.exception) return false;
  if (action === 'approve' || action === 'reject'){
    if (req.currentStage === 'Manager') return user.role==='Manager' && req.status==='PendingManager';
    if (req.currentStage === 'GM')      return user.role==='GM'      && req.status==='PendingGM';
    if (req.currentStage === 'Finance') return user.role==='Finance' && req.status==='PendingFinance';
    return false;
  }
  if (action === 'return'){ return user.role==='Finance' && req.currentStage==='Finance' && req.status==='PendingFinance'; }
  if (action === 'pay'){ return user.role==='Cashier' && req.status==='PendingPayment'; }
  if (action === 'resubmit'){ return user.id===req.requesterId && (req.status==='Returned' || req.status==='Rejected'); }
  return false;
}

function applyAction(req, action, payload){
  const user = currentUser();
  if (!canAct(user, req, action)){ toast(t('toast_authfail'), 'bad'); return false; }
  const prior = req.status;
  const roleLbl = roleLabel(user.role);

  if (action === 'submit-draft'){
    const amountTWD = toTWD(req.amount, req.currency);
    const route = computeRoute(amountTWD, state.config);
    req.amountTWD = Math.round(amountTWD); req.fxRate = FX_TO_TWD[req.currency]||1;
    req.routeLevel = route.level; req.stages = route.stages; req.highValue = route.highValue;
    req.currentStage = route.stages[0]; req.status = 'Pending' + route.stages[0];
    req.history.push(mkEvent({
      requestId:req.id, actor:user.name, role:'Requester', action:'Submit',
      comment:'Draft submitted for approval. Route computed automatically (Level '+route.level+(req.currency!=='TWD' ? '; converted to ~NT$'+req.amountTWD.toLocaleString()+' at demo FX rate '+req.fxRate : '')+').',
      prior, resulting:req.status
    }));
    notify(notifyRoleId(req.currentStage), req.id, 'New expense request '+req.id+' awaiting your approval ('+fmtAmount(req.amount,req.currency)+').');
    logSystemEvent(user.name, 'Submission', req.id+' submitted from Draft (Level '+route.level+').');
  }
  else if (action === 'approve'){
    const idx = req.stages.indexOf(req.currentStage);
    if (req.currentStage === 'Finance'){
      req.status = 'PendingPayment'; req.currentStage = 'Cashier';
      notify(notifyRoleId('Cashier'), req.id, 'Request '+req.id+' approved by Finance — ready for payment.');
    } else {
      const next = req.stages[idx+1];
      req.currentStage = next; req.status = 'Pending' + next;
      notify(notifyRoleId(next), req.id, 'Request '+req.id+' awaiting your approval ('+fmtAmount(req.amount,req.currency)+').');
    }
    req.history.push(mkEvent({requestId:req.id, actor:user.name, role:roleLbl, action:'Approve', comment:payload.comment||'', prior, resulting:req.status}));
    logSystemEvent(user.name, 'Approval', req.id+' approved at '+req.currentStage+' stage.');
  }
  else if (action === 'reject'){
    req.returnedFrom = req.currentStage; req.status = 'Rejected';
    req.history.push(mkEvent({requestId:req.id, actor:user.name, role:roleLbl, action:'Reject', comment:payload.comment, prior, resulting:'Rejected'}));
    notify(req.requesterId, req.id, 'Request '+req.id+' was rejected by '+roleLbl+' — action needed.');
    logSystemEvent(user.name, 'Rejection', req.id+' sent back to requester from '+req.returnedFrom+' stage.');
  }
  else if (action === 'return'){
    const target = payload.target || 'Requester';
    if (target === 'Requester'){
      req.returnedFrom = req.currentStage; req.status = 'Returned';
      req.history.push(mkEvent({requestId:req.id, actor:user.name, role:roleLbl, action:'Return', comment:payload.comment, prior, resulting:'Returned'}));
      notify(req.requesterId, req.id, 'Request '+req.id+' was returned by '+roleLbl+' — action needed.');
      logSystemEvent(user.name, 'Return', req.id+' returned to requester from '+req.currentStage+' stage.');
    } else {
      req.currentStage = target; req.status = 'Pending' + target;
      req.history.push(mkEvent({requestId:req.id, actor:user.name, role:roleLbl, action:'Return', comment:payload.comment+' (Returned to '+roleLabel(target)+')', prior, resulting:req.status}));
      notify(notifyRoleId(target), req.id, 'Request '+req.id+' returned to you by '+roleLbl+' for re-review.');
      logSystemEvent(user.name, 'Return', req.id+' returned to '+target+' stage by '+roleLbl+'.');
    }
  }
  else if (action === 'resubmit'){
    const target = req.returnedFrom;
    req.currentStage = target; req.status = 'Pending' + target; req.returnedFrom = null;
    if (payload.attachmentFilename){ req.attachment = {filename:payload.attachmentFilename, missing:false}; }
    req.history.push(mkEvent({requestId:req.id, actor:user.name, role:roleLabel('Requester'), action:'Resubmit', comment:payload.comment, prior, resulting:req.status}));
    notify(notifyRoleId(target), req.id, 'Request '+req.id+' corrected and resubmitted for your review.');
    logSystemEvent(user.name, 'Resubmit', req.id+' resubmitted to '+target+' stage.');
  }
  else if (action === 'pay'){
    req.status = 'Paid'; req.currentStage = 'Paid'; req.locked = true;
    req.paymentRef = payload.paymentRef; req.paymentDate = payload.paymentDate;
    req.history.push(mkEvent({requestId:req.id, actor:user.name, role:roleLabel('Cashier'), action:'Payment', comment:'Payment reference '+payload.paymentRef+' recorded. Approved amount left unmodified.', prior, resulting:'Paid'}));
    notify(req.requesterId, req.id, 'Payment completed for '+req.id+' — request closed.');
    logSystemEvent(user.name, 'Payment', req.id+' marked Paid / Closed and locked.');
  }
  return true;
}

function requestsForRole(user){
  if (user.role === 'Requester'){ return state.requests.filter(r=>r.requesterId===user.id && (r.status==='Returned' || r.status==='Rejected')); }
  const stageStatus = {Manager:'PendingManager', GM:'PendingGM', Finance:'PendingFinance', Cashier:'PendingPayment'}[user.role];
  return state.requests.filter(r=>r.status===stageStatus);
}
function statusBadge(req){
  if (req.status==='Draft') return '<span class="badge neutral">'+t('status_Draft')+'</span>';
  if (req.status==='Paid') return '<span class="badge good">'+t('status_Paid')+'</span>';
  if (req.status==='Returned') return '<span class="badge bad">'+t('status_Returned')+'</span>';
  if (req.status==='Rejected') return '<span class="badge bad">'+t('status_Rejected')+'</span>';
  return '<span class="badge info">'+t('status_'+req.status)+'</span>';
}
function routeLevelBadge(req){
  if (req.routeLevel==null) return '<span class="badge neutral">'+t('status_Draft')+'</span>';
  if (req.highValue) return '<span class="badge hv">'+t('level3')+' · '+t('hv_badge')+'</span>';
  if (req.routeLevel===2) return '<span class="badge warn">'+t('level2')+'</span>';
  return '<span class="badge neutral">'+t('level1')+'</span>';
}
function renderStepper(req){
  const skipGM = req.routeLevel === 1;
  const order = ['Requester','Manager','GM','Finance','Cashier'];
  const isPaid = req.status === 'Paid';
  let currentIdx;
  if (isPaid) currentIdx = order.length - 1; // merged Cashier/Paid step, fully done
  else if (req.status==='Returned' || req.status==='Rejected') currentIdx = order.indexOf(req.returnedFrom);
  else if (req.status==='Draft') currentIdx = -1;
  else currentIdx = order.indexOf(req.currentStage);

  let html = '<div class="stepper">';
  order.forEach((stg, i)=>{
    const isSkipped = stg==='GM' && skipGM;
    const isMergedDone = isPaid && i === order.length-1;
    let cls = 'step';
    if (isSkipped) cls += ' skipped';
    else if (isMergedDone) cls += ' done';
    else if (i < currentIdx) cls += ' done';
    else if (i === currentIdx) cls += ' current';
    if (i>0){ html += '<div class="connector'+(i<=currentIdx && !isSkipped ? ' filled':'')+'"></div>'; }
    const label = roleLabel(stg);
    const dotContent = isSkipped ? '—' : ((i < currentIdx || isMergedDone) ? '✓' : (i+1));
    html += '<div class="'+cls+'"><div class="node"><div class="dot">'+dotContent+'</div><div class="lbl">'+label+'</div></div></div>';
  });
  html += '</div>';
  return html;
}
function shellHeader(title, sub){
  return '<div class="flex-between gap-md" style="margin-bottom:18px;"><div><h1>'+title+'</h1>'+(sub?'<p class="small" style="margin:0;">'+sub+'</p>':'')+'</div></div>';
}

  return '<table><tbody>' + results.map(u=>'<tr><td>'+u.name+'</td><td class="muted">'+userTitle(u)+'</td><td class="muted">'+userDept(u)+'</td></tr>').join('') + '</tbody></table>';
}
function onEmpSearch(v){ state.empSearch = v; document.getElementById('empResults').innerHTML = renderEmpResults(v); }

/* ---------- EXPENSE WORKSPACE ---------- */
function visibleRequestsForRole(u){
  if (u.role === 'Requester') return state.requests.filter(r=>r.requesterId===u.id);
  return state.requests.filter(r=>Array.isArray(r.stages) && r.stages.includes(u.role));
}
function viewExpense(){
  const u = currentUser();
  const all = visibleRequestsForRole(u);
  const counts = {
    All: all.length,
    'In Approval': all.filter(r=>['PendingManager','PendingGM','PendingFinance','PendingPayment'].includes(r.status)).length,
    Returned: all.filter(r=>r.status==='Returned' || r.status==='Rejected').length,
    Paid: all.filter(r=>r.status==='Paid').length,
  };
  let list = all;
  if (state.expenseFilter!=='All'){
    if (state.expenseFilter==='In Approval') list = list.filter(r=>['PendingManager','PendingGM','PendingFinance','PendingPayment'].includes(r.status));
    else if (state.expenseFilter==='Returned') list = list.filter(r=>r.status==='Returned' || r.status==='Rejected');
    else list = list.filter(r=>r.status===state.expenseFilter);
  }
  const q = (state.expenseSearch||'').toLowerCase().trim();
  if (q) list = list.filter(r => r.id.toLowerCase().includes(q) || r.purpose.toLowerCase().includes(q) || r.payee.toLowerCase().includes(q));

  const rows = list.map(r=>`
    <tr>
      <td><span class="reqid">${r.id}</span>${r.caseTag?' <span class="badge neutral">Case '+r.caseTag+'</span>':''}</td>
      <td>${esc(r.purpose)}</td>
      <td class="amount-cell">${fmtAmount(r.amount,r.currency)}</td>
      <td>${routeLevelBadge(r)}</td>
      <td>${r.status==='Paid'?t('closed'):((r.status==='Returned'||r.status==='Rejected')?t('returned_to_requester'):(r.status==='Draft'?t('status_Draft'):roleLabel(r.currentStage)))}</td>
      <td>${statusBadge(r)}</td>
      <td><button class="btn sm" data-action="nav-detail" data-id="${r.id}">${t('btn_open')}</button></td>
    </tr>`).join('');

  const filterTabs = [['All','f_all'],['In Approval','f_inapproval'],['Returned','f_returned'],['Paid','f_paid']];

  return `
  ${shellHeader(t('expense_title'), t('expense_sub',{l1:state.config.level1Max.toLocaleString(), l2:state.config.level2Max.toLocaleString()}))}
  ${u.role!=='Requester' ? '<div class="notice info gap-sm" style="margin-bottom:14px;">🧭 '+t('expense_scope_note',{role:roleLabel(u.role)})+'</div>' : ''}
  <div class="grid cols-4 gap-md" style="margin-bottom:18px;">
    <div class="card metric"><div class="k">${counts.All}</div><div class="l">${t('m_all')}</div></div>
    <div class="card metric"><div class="k">${counts['In Approval']}</div><div class="l">${t('m_inapproval')}</div></div>
    <div class="card metric"><div class="k">${counts.Returned}</div><div class="l">${t('m_returned')}</div></div>
    <div class="card metric"><div class="k">${counts.Paid}</div><div class="l">${t('m_paid')}</div></div>
  </div>
  <div class="card card-pad">
    <div class="flex-between" style="margin-bottom:10px;">
      <div class="tabbar" style="border:none;margin:0;">
        ${filterTabs.map(([f,k])=>`<button class="${state.expenseFilter===f?'active':''}" data-action="expense-filter" data-filter="${f}">${t(k)} <span class="muted">(${counts[f]})</span></button>`).join('')}
      </div>
      <div class="btnrow">
        <input type="text" id="expSearchInput" placeholder="${t('search_ph')}" value="${esc(state.expenseSearch)}" oninput="onExpenseSearch(this.value)" style="border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.82rem;">
        <button class="btn" data-action="reset-demo">${t('btn_reset')}</button>
        <button class="btn primary" data-action="open-new-expense" ${u.role!=='Requester'?'disabled title="'+esc(t('ne_readonly_notice'))+'"':''}>${t('btn_newexpense')}</button>
      </div>
    </div>
    <div class="table-wrap">
    <table class="searchable">
      <thead><tr><th>${t('th_id')}</th><th>${t('th_purpose')}</th><th>${t('th_amount')}</th><th>${t('th_route')}</th><th>${t('th_stage')}</th><th>${t('th_status')}</th><th>${t('th_action')}</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7" class="muted center" style="padding:26px;">'+t('no_match')+'</td></tr>'}</tbody>
    </table>
    </div>
  </div>
  `;
}
function onExpenseSearch(v){
  state.expenseSearch=v;
  const prev = document.getElementById('expSearchInput');
  const pos = prev ? prev.selectionStart : null;
  renderInto('#viewRoot', viewExpense);
  const next = document.getElementById('expSearchInput');
  if (next){ next.focus(); if (pos!=null) next.setSelectionRange(pos,pos); }
}

function onAmountPreview(v){
  state.neAmount = v;
  const num = Number(v);
  const valid = v!=='' && v!=null && !isNaN(num) && num>0;
  const currency = state.neCurrency || document.getElementById('neCurrency').value;
  const amtEl = document.getElementById('neAmount');
  const errEl = document.getElementById('neAmountError');
  if (amtEl){ amtEl.classList.toggle('invalid', !!v && !valid); }
  if (errEl){ errEl.innerHTML = (v && !valid) ? '<div class="err-text">'+t('ne_amount_error')+'</div>' : ''; }
  const amountTWD = valid ? toTWD(num, currency) : 0;
  const preview = computeRoute(amountTWD, state.config);
  const el = document.getElementById('routePreview');
  if (el){
    const routeStr = preview.stages.map(s=>roleLabel(s)).join(' → ');
    el.innerHTML = '<span>🧭</span><div><strong>'+t('ne_route_title',{level:preview.level, hv:preview.highValue?' · '+t('hv_badge'):''})+'</strong><br>'+routeStr+' → '+t('status_Paid')+'. '+t('ne_route_body')+'</div>';
  }
  const fxHint = document.getElementById('neFxHint');
  if (fxHint){
    if (valid && currency!=='TWD'){ fxHint.style.display=''; fxHint.textContent = t('ne_fx_note',{twd:Math.round(amountTWD).toLocaleString(), rate:FX_TO_TWD[currency]}); }
    else { fxHint.style.display='none'; fxHint.textContent=''; }
  }
}
function onCurrencyPreview(v){ state.neCurrency = v; onAmountPreview(state.neAmount||''); }
function onAttachChange(v){
  state.neAttach = v;
  const wrap = document.getElementById('neFileWrap');
  if (wrap){ wrap.style.display = v==='ok' ? '' : 'none'; }
  const errEl = document.getElementById('neFileError');
  if (errEl) errEl.innerHTML = '';
}

function viewMyWork(){
  const pendingByRole = {};
  USERS.forEach(u=>{

        </div>
      </div>`).join('') : '<p class="muted">'+t('mywork_no_returned')+'</p>';
  } else {
    queueHtml = queue.length ? `<div class="table-wrap"><table><thead><tr><th>${t('th_id')}</th><th>${t('th_purpose')}</th><th>${t('th_amount')}</th><th>${t('th_route')}</th><th>${t('th_action')}</th></tr></thead><tbody>
      ${queue.map(r=>`<tr>
        <td><span class="reqid">${r.id}</span> ${r.caseTag?'<span class="badge neutral">Case '+r.caseTag+'</span>':''}</td>
        <td>${esc(r.purpose)}</td>
        <td class="amount-cell">${fmtAmount(r.amount,r.currency)}</td>
        <td>${routeLevelBadge(r)}</td>
        <td class="btnrow">
          <button class="btn sm" data-action="view-detail-modal" data-id="${r.id}">${t('th_view')}</button>
          ${u.role==='Finance' ? `
            <button class="btn primary sm" data-action="open-action" data-id="${r.id}" data-act="approve">${t('act_approve')}</button>
            <button class="btn danger sm" data-action="open-action" data-id="${r.id}" data-act="return">${t('act_return')}</button>
            <button class="btn danger sm" data-action="open-action" data-id="${r.id}" data-act="reject">${t('act_reject')}</button>
          ` : u.role==='Cashier' ? `
            <button class="btn primary sm" data-action="open-action" data-id="${r.id}" data-act="pay">${t('act_pay')}</button>

/* ---------- REQUEST DETAIL ---------- */
function renderDetailInner(req){
  const requester = userById(req.requesterId);
  const u = currentUser();

  let actions = '';
  if (canAct(u, req, 'submit-draft')) actions += `<button class="btn primary" data-action="edit-request" data-id="${req.id}">${t('act_editdraft')}</button>`;
  if (canAct(u, req, 'approve')) actions += `<button class="btn primary" data-action="open-action" data-id="${req.id}" data-act="approve">${t('act_approve')}</button>`;
  if (canAct(u, req, 'reject')) actions += `<button class="btn danger" data-action="open-action" data-id="${req.id}" data-act="reject">${t('act_reject')}</button>`;
  if (canAct(u, req, 'return')) actions += `<button class="btn danger" data-action="open-action" data-id="${req.id}" data-act="return">${t('act_return')}</button>`;
  if (canAct(u, req, 'pay')) actions += `<button class="btn primary" data-action="open-action" data-id="${req.id}" data-act="pay">${t('act_pay')}</button>`;
  if (canAct(u, req, 'resubmit')) actions += `<button class="btn primary" data-action="edit-request" data-id="${req.id}">${t('mywork_fixresubmit')}</button>`;
  if (!actions) actions = '<span class="muted small">'+t('detail_noactions')+'</span>';

      <h3>State machine</h3>
      <p><strong>Happy path:</strong> Draft → Submitted → Pending Manager → [if amount > NT$5,000, Pending GM] → Pending Finance → Pending Payment → Paid/Closed (Locked).</p>

      <ul class="small">

/* ---------------- Export helpers ---------------- */
function downloadBlob(filename, content, mime){
  const blob = new Blob([content], {type:mime||'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
}
function exportOne(id){
  const req = state.requests.find(r=>r.id===id);
  if (!req) return;
  downloadBlob(id+'-audit-history.json', JSON.stringify(req, null, 2), 'application/json');
  toast(t('toast_exported_one',{id}), 'good');
}
function exportAll(){
  const rows = [['Request_ID','Actor_Name','Role','Action','Prior_Status','Resulting_Status','Comment_Reason','Timestamp']];
  state.requests.forEach(r=> r.history.forEach(h=> rows.push([r.id,h.actor,h.role,h.action,h.prior,h.resulting,(h.comment||'').replace(/\n/g,' '),h.ts]) ));
  const csv = rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  downloadBlob('bv-audit-log.csv', csv, 'text/csv');
  toast(t('toast_exported_all'), 'good');
}

document.addEventListener('submit', function(e){

document.addEventListener('click', function(e){
  if (e.target.classList && e.target.classList.contains('modal-backdrop')){
    if (state.actionModal){ state.actionModal = null; }
    else if (state.detailModalId){ state.detailModalId = null; }
    else { state.newExpenseOpen = false; state.editingRequestId=null; }
    render(); return;
  }

      if (state.identityDropdown || state.notifDropdown){ state.identityDropdown=false; state.notifDropdown=false; render(); }
    }
    return;
  }
  const a = el.dataset.action;
  if (a==='nav'){ state.view = el.dataset.view; state.sidebarOpen=false; render(); }
  else if (a==='nav-detail'){ state.selectedRequestId = el.dataset.id; state.view='detail'; render(); }
  else if (a==='view-detail-modal'){ state.detailModalId = el.dataset.id; render(); }
  else if (a==='close-detail-modal'){ state.detailModalId = null; render(); }
  else if (a==='edit-request'){
    const req = state.requests.find(r=>r.id===el.dataset.id);
    if (req){
      state.editingRequestId = req.id;
      state.neAmount = req.amount ? String(req.amount) : '';
      state.neCurrency = req.currency || 'TWD';
      state.neAttach = req.attachment.missing ? 'missing' : 'ok';
      state.newExpenseOpen = true;
      state.detailModalId = null;
    }
    render();
  }
  else if (a==='toggle-sidebar'){ state.sidebarOpen = !state.sidebarOpen; render(); }
  else if (a==='toggle-identity'){ state.identityDropdown = !state.identityDropdown; state.notifDropdown=false; render(); }

  else if (a==='toggle-notif'){
    state.notifDropdown = !state.notifDropdown; state.identityDropdown=false;
    if (state.notifDropdown){ state.notifications.filter(n=>n.userId===state.currentUserId).forEach(n=>n.read=true); }

  else if (a==='switch-user-login'){ handleGotoLoginAs(state.currentUserId); }

  else if (a==='reset-demo'){ resetDemo(); }

  else if (a==='open-new-expense'){ state.newExpenseOpen = true; state.editingRequestId=null; state.neAmount=''; state.neCurrency='TWD'; state.neAttach='ok'; render(); }
  else if (a==='close-new-expense'){ state.newExpenseOpen = false; state.editingRequestId=null; render(); }

function readNewExpenseForm(){
  return {
    dept: document.getElementById('neDept').value,
    date: document.getElementById('neDate').value,
    type: document.getElementById('neType').value,
    amountRaw: document.getElementById('neAmount').value,
    currency: document.getElementById('neCurrency').value,
    purpose: document.getElementById('nePurpose').value.trim(),
    cc: document.getElementById('neCC').value.trim(),
    payee: document.getElementById('nePayee').value.trim(),
    attachSel: document.getElementById('neAttach').value,
    file: (document.getElementById('neReceiptFile') && document.getElementById('neReceiptFile').files[0]) || null,
  };
}
/* Resolves the attachment object from the current form + (optionally) the draft being edited.
   Returns null when a receipt is required (attachSel==='ok') but neither a new file was chosen
   nor an existing file is already on record — the caller must then block submission. */
function resolveAttachment(f, editingReq){
  if (f.attachSel==='missing') return {filename:null, missing:true};
  if (f.file) return {filename:f.file.name, missing:false};
  if (editingReq && !editingReq.attachment.missing && editingReq.attachment.filename) return editingReq.attachment;
  return null;
}
function handleSubmitNewExpense(){
  const u = currentUser();
  if (u.role!=='Requester'){ toast(t('toast_fillall'), 'bad'); return; }
  const f = readNewExpenseForm();
  const amount = Number(f.amountRaw);
  const amountValid = f.amountRaw!=='' && !isNaN(amount) && amount>0;
  if (!amountValid){
    const amtEl = document.getElementById('neAmount');
    if (amtEl) amtEl.classList.add('invalid');
    const errEl = document.getElementById('neAmountError');
    if (errEl) errEl.innerHTML = '<div class="err-text">'+t('ne_amount_error')+'</div>';
  }
  if (!f.date || !amountValid || !f.purpose || !f.cc || !f.payee){ toast(t('toast_fillall'), 'bad'); return; }

  const editingReq = state.editingRequestId ? state.requests.find(r=>r.id===state.editingRequestId) : null;
  const isResubmitMode = !!(editingReq && (editingReq.status==='Returned' || editingReq.status==='Rejected'));

  let resubmitNote = '';
  if (isResubmitMode){
    const noteEl = document.getElementById('resubmitNote');
    resubmitNote = noteEl ? noteEl.value.trim() : '';
    if (!resubmitNote){
      toast(t('toast_commentreq'), 'bad');
      const errEl = document.getElementById('resubmitNoteError');
      if (errEl) errEl.innerHTML = '<div class="err-text">'+t('toast_commentreq')+'</div>';
      return;
    }
  }

  const attachment = resolveAttachment(f, editingReq);
  if (attachment===null){
    const errEl = document.getElementById('neFileError');
    if (errEl) errEl.innerHTML = '<div class="err-text">'+t('ne_file_required')+'</div>';
    toast(t('toast_file_required'), 'bad');
    return;
  }

  if (editingReq){
    editingReq.department=f.dept; editingReq.expenseDate=f.date; editingReq.expenseType=f.type;
    editingReq.amount=amount; editingReq.currency=f.currency; editingReq.purpose=f.purpose;
    editingReq.costCenter=f.cc; editingReq.payee=f.payee; editingReq.attachment=attachment;
    const ok = isResubmitMode
      ? applyAction(editingReq, 'resubmit', {comment: resubmitNote})
      : applyAction(editingReq, 'submit-draft', {});
    if (!ok) return;
    state.newExpenseOpen = false;
    state.editingRequestId = null;
    state.selectedRequestId = editingReq.id;
    state.view = 'detail';
    render();
    if (isResubmitMode) toast(t('toast_resubmitted',{id:editingReq.id, stage:roleLabel(editingReq.currentStage)}), 'good');
    else toast(t('toast_submitted',{id:editingReq.id, stage:roleLabel(editingReq.currentStage)}), 'good');
    return;
  }

  const req = buildRequest({requesterId:u.id, department:f.dept, expenseDate:f.date, expenseType:f.type, amount, currency:f.currency, purpose:f.purpose, costCenter:f.cc, payee:f.payee, attachment});
  state.requests.push(req);
  logSystemEvent(u.name, 'Submission', req.id+' submitted (Level '+req.routeLevel+').');
  state.newExpenseOpen = false;
  state.selectedRequestId = req.id;
  state.view = 'detail';
  render();
  toast(t('toast_submitted',{id:req.id, stage:roleLabel(req.currentStage)}), 'good');
}
function handleSaveDraftExpense(){
  const u = currentUser();
  if (u.role!=='Requester'){ toast(t('toast_fillall'), 'bad'); return; }
  const f = readNewExpenseForm();
  const amount = Number(f.amountRaw);
  const amountValid = f.amountRaw!=='' && !isNaN(amount) && amount>0;

  const editingReq = state.editingRequestId ? state.requests.find(r=>r.id===state.editingRequestId) : null;
  const resolved = resolveAttachment(f, editingReq);
  const attachment = resolved===null ? {filename:null, missing:true} : resolved; // lenient for drafts

  if (editingReq){
    editingReq.department=f.dept; editingReq.expenseDate=f.date||null; editingReq.expenseType=f.type;
    editingReq.amount = amountValid ? amount : 0; editingReq.currency=f.currency;
    editingReq.purpose=f.purpose; editingReq.costCenter=f.cc; editingReq.payee=f.payee;
    editingReq.attachment=attachment;
    editingReq.history.push(mkEvent({requestId:editingReq.id, actor:u.name, role:roleLabel('Requester'), action:'Draft', comment:'Draft updated.', prior:'Draft', resulting:'Draft'}));
    logSystemEvent(u.name, 'Draft', editingReq.id+' draft updated.');
    state.newExpenseOpen = false;
    state.editingRequestId = null;
    state.selectedRequestId = editingReq.id;
    state.view = 'detail';
    render();
    toast(t('toast_draft_saved',{id:editingReq.id}), 'good');
    return;
  }

  const req = buildDraftRequest({
    requesterId:u.id, department:f.dept, expenseDate:f.date||null, expenseType:f.type,
    amount: amountValid ? amount : 0, currency:f.currency, purpose:f.purpose, costCenter:f.cc, payee:f.payee, attachment
  });
  state.requests.push(req);
  logSystemEvent(u.name, 'Draft', req.id+' saved as draft.');
  state.newExpenseOpen = false;
  state.selectedRequestId = req.id;
  state.view = 'detail';
  render();
  toast(t('toast_draft_saved',{id:req.id}), 'good');
}

function handleConfirmAction(id, act){
  const req = state.requests.find(r=>r.id===id);
  if (!req) return;
  if (act==='approve' || act==='reject' || act==='return'){
    const comment = document.getElementById('cmtInput').value.trim();
    if (!comment){
      toast(t('toast_commentreq'), 'bad');
      const errEl = document.getElementById('cmtError');
      if (errEl) errEl.innerHTML = '<div class="err-text">'+t('toast_commentreq')+'</div>';
      return;
    }
    const target = act==='return' ? document.getElementById('returnTarget').value : undefined;
    const ok = applyAction(req, act, {comment, target});
    if (ok){ state.actionModal=null; render(); toast(req.id+' '+(act==='approve'?t('toast_approved'):(act==='reject'?t('toast_rejected'):t('toast_returnedv')))+'.', 'good'); }
  } else if (act==='pay'){
    const paymentRef = document.getElementById('payRef').value.trim();
    const paymentDate = document.getElementById('payDate').value;
    if (!paymentRef || !paymentDate){ toast(t('toast_payreq'), 'bad'); return; }
    const ok = applyAction(req, 'pay', {paymentRef, paymentDate});
    if (ok){ state.actionModal=null; render(); toast(t('toast_paidclosed',{id:req.id}), 'good'); }
  } else if (act==='resubmit'){
    const comment = document.getElementById('cmtInput').value.trim();
    if (!comment){
      toast(t('toast_commentreq'), 'bad');
      const errEl = document.getElementById('cmtError');
      if (errEl) errEl.innerHTML = '<div class="err-text">'+t('toast_commentreq')+'</div>';
      return;
    }
    const fixEl = document.getElementById('fixFile');
    const attachmentFilename = fixEl ? fixEl.value.trim() : null;
    const ok = applyAction(req, 'resubmit', {comment, attachmentFilename});
    if (ok){ state.actionModal=null; render(); toast(t('toast_resubmitted',{id:req.id, stage:roleLabel(req.currentStage)}), 'good'); }
  }
}

function handleSaveConfig(){
  const l1 = Number(document.getElementById('lvl1').value);
  const l2 = Number(document.getElementById('lvl2').value);
  if (!(l1>0 && l2>l1)){ toast(t('toast_config_invalid'), 'bad'); return; }
  const old = {...state.config};
  state.config = {level1Max:l1, level2Max:l2};
  logSystemEvent(currentUser().name, 'Configuration', 'Routing thresholds changed: L1 '+old.level1Max+'→'+l1+', L2 '+old.level2Max+'→'+l2+'. Applies to new submissions only.');
  toast(t('toast_config_saved'), 'good');
  render();
}

function handleToggleUserActive(id){
  const u = userById(id);
  if (!u) return;
  const wasActive = u.active!==false;
  u.active = !wasActive;
  logSystemEvent(currentUser().name, 'Configuration', u.name+' ('+roleLabel(u.role)+') '+(u.active?'activated':'deactivated')+'.');
  if (!u.active && state.currentUserId===u.id){
    const fallback = activeUsers()[0];
    if (fallback){
      state.currentUserId = fallback.id;
      toast(t('toast_user_deactivated',{name:u.name, fallback:fallback.name}), 'bad');
    }
  } else if (u.active){
    toast(t('toast_user_activated',{name:u.name}), 'good');
  }
  render();
}
function handleAddNewRole(){
  const newId = uid('U');
  USERS.push({id:newId, name:'', role:'Manager', title_en:'', title_zh:'', dept_en:'', dept_zh:'', group:entraGroupForRole('Manager'), active:true, custom:true});
  logSystemEvent(currentUser().name, 'Configuration', 'New role assignment row added.');
  render();
}
function handleSimulateException(){
  const sel = document.getElementById('excTarget');
  const id = sel && sel.value;
  const req = state.requests.find(r=>r.id===id);
  if (!req) return;
  req.exception = {
    correlationId: uid('COR'),
    message: 'Transient connector timeout calling the Approval Notification flow. Last committed state preserved; no data was lost.',
    occurredAt: nowISO(), lastValidState: req.status,
  };
  logSystemEvent('System', 'Exception', 'Simulated flow failure on '+req.id+' (Correlation '+req.exception.correlationId+'). Flow Owner alerted.');
  toast(t('toast_exception_sim',{id:req.id}), 'bad');
  render();
}
function handleRetryException(id){
  const req = state.requests.find(r=>r.id===id);
  if (!req || !req.exception) return;
  const cor = req.exception.correlationId;
  req.exception = null;
  logSystemEvent(currentUser().name, 'Recovery', 'Retried '+req.id+' (Correlation '+cor+'). Idempotent retry confirmed — state resumed at '+req.status+' with no duplicate transition, notification, or payment.');
  toast(t('toast_exception_recovered',{id:req.id}), 'good');
  render();
}

/* ---------------- Font switching per language (spec section 1) ---------------- */
function applyLangFonts(){
  const root = document.documentElement;
  if (state.lang==='zh'){
    root.style.setProperty('--font-body', "'Microsoft JhengHei','PMingLiU','Heiti TC',sans-serif");
    root.style.setProperty('--font-display', "'Microsoft JhengHei','PMingLiU','Heiti TC',sans-serif");
    root.setAttribute('lang','zh-Hant');
  } else {
    root.style.setProperty('--font-body', "Arial, Helvetica, sans-serif");
    root.style.setProperty('--font-display', "Arial, Helvetica, sans-serif");
    root.setAttribute('lang','en');
  }
}

storageOK = detectStorage();

if (!restored){
  state.requests = seedRequests();
  logSystemEvent('System', 'Init', 'Demo environment initialized. Cases A–D seeded.');
}
render();
